name: run-tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TUIST_VERSION: 4.123.0

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Cache Tuist Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
            ~/.tuist
          key: tuist-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved') }}
          restore-keys: tuist-${{ runner.os }}-

      - name: Install Tuist
        run: |
          mise install tuist@${{ env.TUIST_VERSION }}
          mise use -g tuist@${{ env.TUIST_VERSION }}
          tuist version

      - name: Create Config Files
        run: |
          mkdir -p Configs
          echo "// Debug Configuration" > Configs/debug.xcconfig
          echo "// Release Configuration" > Configs/release.xcconfig

      - name: Install Dependencies & Generate Project
        run: |
          tuist install
          tuist generate --no-open

      - name: Boot Simulator
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b

      - name: Build for Testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace Workspace.xcworkspace \
            -scheme App \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | xcpretty --color

      - name: Run Tests
        run: |
          set -o pipefail
          for scheme in Core Domain Data Presentation; do
            echo "=== Testing $scheme ==="
            xcodebuild test-without-building \
              -workspace Workspace.xcworkspace \
              -scheme "$scheme" \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -resultBundlePath "build/${scheme}Tests.xcresult" \
              | xcpretty --color
          done
