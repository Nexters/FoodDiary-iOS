name: run-tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TUIST_VERSION: 4.123.0

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Cache Tuist Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
            ~/.tuist
          key: tuist-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved') }}
          restore-keys: tuist-${{ runner.os }}-

      - name: Install Tuist
        run: |
          mise install tuist@${{ env.TUIST_VERSION }}
          mise use -g tuist@${{ env.TUIST_VERSION }}
          tuist version

      - name: Create Config Files
        run: |
          mkdir -p Configs
          echo "// Debug Configuration" > Configs/debug.xcconfig
          echo "// Release Configuration" > Configs/release.xcconfig

      - name: Install Dependencies & Generate Project
        run: |
          tuist install
          tuist generate --no-open

      - name: Boot Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | map(select(.key | contains("iOS"))) | last | .value | map(select(.name == "iPhone 16")) | first | .udid')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Workspace.xcworkspace \
            -scheme App \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath build/TestResults.xcresult \
            2>&1 | xcbeautify --renderer github-actions
